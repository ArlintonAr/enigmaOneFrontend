<ul class="menu bg-slate-800 lg:menu-horizontal rounded-lg border border-slate-700 p-1.5 gap-1">
  @for (item of subMenu(); track $index) {
    <li>
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-gradient-to-r from-indigo-600 to-purple-600"
        class="rounded-lg transition-all duration-200 hover:bg-slate-700 flex items-center gap-2.5 px-3 py-2"
      >
        <!-- Icono -->
        <div class="w-7 h-7 rounded-md bg-slate-700/70 flex items-center justify-center transition-colors duration-200 [a[routerLinkActive]_&]:bg-indigo-500/20">
          <i [class]="item.icon" class="text-sm text-slate-300 transition-colors [a[routerLinkActive]_&]:text-white"></i>
        </div>

        <!-- Nombre -->
        <span class="font-medium text-sm text-slate-200 transition-colors [a[routerLinkActive]_&]:text-white">
          {{item.name}}
        </span>

        <!-- Badge de descripción -->
        <span class="badge badge-sm bg-slate-700 border-slate-600 text-slate-400 text-xs transition-colors [a[routerLinkActive]_&]:bg-indigo-500/30 [a[routerLinkActive]_&]:border-indigo-500 [a[routerLinkActive]_&]:text-indigo-200">
          {{item.description}}
        </span>
      </a>
    </li>
  }
</ul>
