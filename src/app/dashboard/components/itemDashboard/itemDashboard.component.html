
<div id="nav" class="w-full px-3 flex flex-col gap-6">

  <!-- Menu Items -->
  <div class="content-items flex flex-col gap-1">
    <p class="text-xs font-bold uppercase tracking-wider text-slate-500 px-3 mb-2">Navegación</p>

    @for(item of items; track $index) {

      <a [routerLink]="item.route"
        routerLinkActive="bg-gradient-to-r from-primary/90 to-primary/70 border-primary/50 shadow-lg shadow-primary/20"
        class="group relative w-full px-4 py-3 inline-flex items-center gap-3 border border-slate-700/30 rounded-xl hover:bg-slate-700/30 hover:border-primary/30 transition-all duration-300 ease-out overflow-hidden">

        <!-- Efecto de brillo al hover -->
        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/5 to-transparent translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700"></div>

        <!-- Icono -->
        <div class="relative z-10 w-10 h-10 rounded-lg bg-slate-800/50 group-hover:bg-primary/20 flex items-center justify-center transition-all duration-300 group-hover:scale-110 group-hover:rotate-3">
          <i [class]="item.icon" class="text-lg group-hover:text-primary transition-colors"></i>
        </div>

        <!-- Texto -->
        <div class="relative z-10 flex flex-col flex-1 min-w-0">
          <span class="text-sm font-bold leading-tight text-white group-hover:text-white transition-colors">
            {{item.title}}
          </span>
          <span class="text-xs text-slate-400 hidden md:block truncate group-hover:text-slate-300 transition-colors">
            {{item.description}}
          </span>
        </div>

        <!-- Chevron indicator -->
        <div class="relative z-10 opacity-0 group-hover:opacity-100 transition-all duration-300 group-hover:translate-x-1">
          <i class="fas fa-chevron-right text-xs text-primary"></i>
        </div>

      </a>
    }
  </div>

  <!-- Logout button -->
  <div class="content flex justify-end mt-auto">
    @if(authService.authStatus()==='Authenticated') {
      <div class="logout w-full">
        <button
          class="btn btn-sm btn-error w-full gap-2 shadow-lg hover:shadow-xl hover:scale-[1.02] transition-all duration-300 group"
          (click)="logout()">
          <i class="fas fa-sign-out-alt group-hover:rotate-12 transition-transform duration-300"></i>
          <span class="font-semibold">Cerrar Sesión</span>
        </button>
      </div>
    }
  </div>

</div>

<style>
/* Animación adicional para el item activo */
a[routerLinkActive].bg-gradient-to-r {
  animation: pulseGlow 2s ease-in-out infinite;
}

@keyframes pulseGlow {
  0%, 100% {
    box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
  }
  50% {
    box-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
  }
}
</style>
