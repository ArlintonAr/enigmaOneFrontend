<div class="content p-4 min-h-[30%] overflow-auto grid gap-4 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4">
  @if(orderList()){

    @for (order of orderList(); track $index) {
      <div class="content-order">
        <order-card [order]="order"
        [activeButtonAuthorization]="activeButtonAuthorization()"
        [activeButtonInRoute]="activeButtonInRoute()" />
      </div>
    }
  }


</div>
